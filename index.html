<style>
:root{--bg:#f6f3ec;--card:#fff;--tx:#1f2430;--mut:#6b7280;--pri:#9c2a2a;--prit:#fff;--ok:#1f7a45;--okb:#e2f4e9;--no:#b8322a;--nob:#fbe6e3;--bd:#e2dccf;--sel:#fff3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1f222a;--tx:#ece9e2;--mut:#9aa1ad;--pri:#e0695e;--prit:#1a1210;--ok:#52c685;--okb:#173324;--no:#f0766b;--nob:#3a1f1d;--bd:#33373f;--sel:#3a3320}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1f222a;--tx:#ece9e2;--mut:#9aa1ad;--pri:#e0695e;--prit:#1a1210;--ok:#52c685;--okb:#173324;--no:#f0766b;--nob:#3a1f1d;--bd:#33373f;--sel:#3a3320}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
h1{margin:.2em 0 0;font-size:1.7rem}h2,h3{margin:.9em 0 .4em}.mut{color:var(--mut);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.chk{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;cursor:pointer}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px}
button.pri{background:var(--pri);color:var(--prit);border-color:var(--pri);font-weight:600}button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.sc{font-weight:700;color:var(--pri)}
.prog{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--pri)}
.stem{font-weight:600;font-size:1.05rem;margin:.6em 0}
blockquote{margin:8px 0;padding:8px 12px;border-left:4px solid var(--pri);background:var(--bg);border-radius:6px;font-style:italic}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border:1px solid var(--bd);padding:6px 8px;text-align:left}th{background:var(--bg)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 14px}.opt.sel{background:var(--sel)}
.opt.ok,.row.ok{background:var(--okb);border-color:var(--ok)}.opt.no,.row.no{background:var(--nob);border-color:var(--no)}
.row{border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}.yn{display:flex;gap:8px;margin-top:8px}.yn button.sel{background:var(--sel);border-color:var(--pri);font-weight:700}
.ans{margin-top:6px;font-size:.9rem}.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:14px}
.big{font-size:2.6rem;font-weight:800;color:var(--pri)}.ctr{text-align:center}.rv{border-top:1px solid var(--bd);padding:10px 0}.good{color:var(--ok)}.bad{color:var(--no)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none}#toast.on{opacity:1}
</style></head><body><div id="app"></div><div id="toast"></div>

tem":"Một trong những thách thức của Cộng đồng ASEAN là","passage":[],"options":["sự xâm lược của các cường quốc.","chưa có nền văn hóa chung.","những tranh chấp về chủ quyền.","mục tiêu phát triển chưa hợp lí."],"answer":2},{"n":10,"stem":"Một trong những nội dung hoạt động của Cộng đồng Văn hóa - Xã hội ASEAN (ASCC) là","passage":[],"options":["tạo dựng môi trường hòa bình.","phát triển cơ sở hạ tầng.","lưu chuyển tự do của hàng hóa.","xây dựng bản sắc ASEAN."],"answer":3},{"n":11,"stem":"Hội nghị cấp cao ASEAN không chính thức được tổ chức tại Ma-lai-xi-a (1997) đã thông qua văn kiện nào sau đây?","passage":[],"options":["Hiến chương ASEAN.","Tuyên bố Cua-la Lăm-pơ.","Tầm nhìn ASEAN 2020.","Tuyên bố Băng Cốc."],"answer":2},{"n":12,"stem":"Cộng đồng ASEAN được xây dựng dựa trên cơ sở pháp lý nào?","passage":[],"options":["Hiến chương ASEAN (2007).","Tuyên bố Bali I (1976).","Tuyên bố Cu-a-la Lăm-pơ (2015).","Tuyên bố Băng Cốc (1967)."],"answer":0},{"n":13,"stem":"Nội dung nào sau đây là thách thức của Cộng đồng ASEAN ?","passage":[],"options":["Ô nhiễm môi trường, biến đổi khí hậu.","Chưa hoàn thiện chính sách, cơ chế hợp tác.","Chưa đề ra được nguyên tắc hoạt động.","Sự suy giảm vai trò các diễn đàn thế giới."],"answer":0},{"n":14,"stem":"Mục tiêu xây dựng một cộng đồng hòa bình và thịnh vượng ở Đông Nam Á lần đầu tiên được đề ra trong văn kiện nào sau đây?","passage":[],"options":["Hiến chương ASEAN (2007).","Hiệp ước Bali I (1976).","Tuyên bố Kuala Lumpur (2015).","Tuyên bố Băngkok (1967)."],"answer":3},{"n":15,"stem":"Một trong những thách thức nội khối của Cộng đồng ASEAN là","passage":[],"options":["sự cạnh tranh ảnh hưởng của các nước lớn.","diễn biến phức tạp của tình hình Biển Đông.","diễn biến phức tạp của tình hình quốc tế.","còn tồn tại một số mâu thuẫn song phương."],"answer":3},{"n":16,"stem":"Nội dung nào sau đây không phải là trụ cột của Cộng đồng ASEAN?","passage":[],"options":["Cộng đồng Kinh tế.","Cộng đồng năng lượng nguyên tử.","Cộng đồng Văn ế quốc tế của ASEAN ngày càng được nâng cao."],"answer":3},{"n":23,"stem":"Nội dung nào sau đây phản ánh đúng một trong những đặc trưng của Cộng đồng ASEAN?","passage":[],"options":["Là liên minh quân sự để ứng phó với các thách thức an ninh phi truyền thống trong khu vực.","Vận hành theo cơ chế nhất thể hóa về chính trị-an ninh, kinh tế, văn hóa của ASEAN.","Tổ chức siêu quốc gia hoạt động trên nguyên tắc đồng thuận và tôn trọng chủ quyền quốc gia.","Hoạt động theo mô hình hợp tác liên chính phủ, với cơ sở pháp lý là Hiến chương ASEAN."],"answer":3},{"n":24,"stem":"Nhận xét nào sau đây đúng về quá trình xây dựng Cộng đồng ASEAN?","passage":[],"options":["Sự đồng nhất về văn hóa và thể chế chính trị là cơ sở thành lập Cộng đồng ASEAN.","Việc hiện thực hóa Cộng đồng ASEAN tạo ra dấu mốc trong tiến trình liên kết khu vực.","Kế hoạch xây dựng Cộng đồng ASEAN được đề ra ngay khi thành lập tổ chức ASEAN.","Quá trình hiện thực hóa ý tưởng Cộng đồng ASEAN không chịu tác động từ bên ngoài."],"answer":1},{"n":25,"stem":"Một trong những văn kiện nêu rõ kế hoạch xây dựng Cộng đồng ASEAN là","passage":[],"options":["Hiến chương nền tảng Cộng đồng ASEAN.","Tuyên bố chung tại Cua-la Lăm-pơ (Ma-lai-xi-a).","Kế hoạch tổng thể xây dựng Cộng đồng ASEAN.","Lộ trình xây dựng Cộng đồng ASEAN (2009 – 2015)."],"answer":3},{"n":26,"stem":"Để khai thác hiệu quả cơ hội từ việc tự do lưu chuyển lao động trong Cộng đồng Kinh tế ASEAN (AEC), giải pháp cấp thiết nhất đối với Việt Nam hiện nay là gì?","passage":[],"options":["Áp dụng hệ thống pháp luật chung của khu vực ASEAN.","Chuyển dịch nhanh toàn bộ lao động sang ngành dịch vụ.","Tập trung nâng cao chất lượng nguồn nhân lực và ngoại ngữ.","Hạn chế sử dụng máy móc để ưu tiên giải quyết việc làm."],"answer":2},{"n":27,"stem":"Nội dung nào sau đây là triển vọng của Cộng đồng ASEAN sau năm 2015?","passage":[],"options":["Sự chênh lệch về thu nhập, trình độ phát triển giữa các nước thành viên.","Giải quyết triệt để tình trạng biến đổi khí hậu, ô nhiễm môi trường.","Trở thành trung tâm kinh tế - tài chính duy nhất của thế giới hiện đại.","Uy tín, vị thế ngày càng được nâng cao trong khu vực và trên thế giới."],"answer":3},{"n":28,"stem":"Sự ra đời của Cộng đồng ASEAN đánh dấu bước phát triển mới trong hợp tác khu vực ở Đông Nam Á vì một trong những lí do nào sau đây?","passage":[],"options":["Thúc đẩy sự liên kết sâu rộng và toàn diện trên nhiều lĩnh vực giữa các nước thành viên.","Đã giải quyết mọi mâu thuẫn, nhất là xung đột quân sự giữa các nước trong khu vực.","Tạo động lực để ASEAN trở thành trung tâm kinh tế – tài chính lớn nhất trên thế giới.","Hoàn thiện được cơ cấu tổ chức và xác lập những nguyên tắc hoạt động của ASEAN."],"answer":0},{"n":29,"stem":"Nội dung nào sau đây không phản ánh đúng ý nghĩa sự thành lập Cộng đồng ASEAN?","passage":[],"options":["Góp phần định hướng cho sự phát triển của ASEAN trong tương lai.","Chấm dứt hoàn toàn sự chia rẽ trong nội bộ các nước ASEAN.","Đưa sự hợp tác toàn diện giữa các nước lên một nấc thang mới.","Đáp ứng nguyện vọng phát triển của các quốc gia thành viên."],"answer":1},{"n":30,"stem":"Nội dung nào sau đây không phản ánh đúng thách thức của Cộng đồng ASEAN?","passage":[],"options":["Khoảng cách phát triển về kinh tế giữa các quốc gia thành viên.","Sự đa dạng của các nước thành viên về chế độ chính trị, tôn giáo.","Vấn đề an ninh phi truyền thống trong khu vực ngày càng gia tăng.","Cơ chế và chính sách hợp tác đang ngày càng được hoàn thiện."],"answer":3}],"tf":[{"n":1,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Chúng tôi cam kết xây dựng Cộng đồng ASEAN hòa bình, ổn định, gắn kết và tự cường; lấy người dân làm trung tâm, có năng lực ứng phó hiệu quả với các thách thức hiện tại và tương lai; là một khu vực năng động, liên kết chặt chẽ, phát triển bền vững, thu hẹp khoảng cách phát triển và giữ vững vai trò trung tâm của ASEAN trong cấu trúc khu vực đang định hình.”"},{"t":"p","text":"(Ban Thư ký ASEAN, Tuyên bố Kuala Lumpur về Tầm nhìn Cộng đồng ASEAN 2025, Ban Thư ký ASEAN, 2015, tr. 1–2.)"}],"items":[{"text":"Hòa bình, ổn định là mục tiêu chính của cộng đồng chính trị - an ninh ASEAN.","answer":true},{"text":"Cộng chính trị - an ninh tạo môi trường thuận lợi để cộng đồng kinh tế phát triển, cộng đồng kinh tế thúc đẩy sự tiến bộ của cộng đồng văn hóa – xã hội.","answer":true},{"text":"Thực chất cộng đồng ASEAN là một cộng đồng “thống nhất trong đa dạng”, vì có sự tương đồng khá lớn giữa các nước thành viên, nhất là về chế độ chính trị, trình độ phát triển và nền văn hóa bản địa.","answer":false},{"text":"Cộng đồng ASEAN có đặc trưng là một tổ chức liên Chính phủ, bình đẳng chủ quyền giữa các quốc gia thành viên, ra quyết định theo nguyên tắc nhất trí, có quyền lợi và nghĩa vụ như nhau.","answer":true}]},{"n":2,"stem":"Cho đoạn tư liệu sau:","passage":[{"t":"p","text":"“Sự ra đời của Cộng đồng ASEAN vào ngày 31/12/2015, đã nâng cao vai trò và giá trị chiến lược của ASEAN […]. Thông qua tiến trình liên kết nội khối, hợp tác về chính trị - an ninh, đặc biệt là trong ngăn ngừa xung đột bằng cách xây dựng lòng tin và chia sẻ các quy tắc ứng xử, ASEAN đã trở thành một nhân tố quan trọng hàng đầu trong bảo đảm hòa bình, ổn định và hợp tác vì sự phát triển ở khu vực […]. Các đối tác đều coi trọng quan hệ và đẩy mạnh hợp tác toàn diện với ASEAN cả trong khuôn khổ đa phương và song phương”."},{"t":"p","text":"(Trần Xuân Hiệp, Trương Công Vĩnh Khánh, ASEAN: 55 năm hình thành và phát triển (1967-2022),NXB Thông tin và Truyền thông, Hà Nội, 2022, tr.290)"}],"items":[{"text":"“Sự ra đời của Cộng đồng ASEAN vào ngày 31/12/2015” đã nâng cao vai trò và giá trị chiến lược của ASEAN.","answer":true},{"text":"Một trong những cơ sở quan trọng giúp ASEAN trở thành tổ chức khu vực thành công là việc áp dụng các biện pháp an ninh tập thể nhằm răn đe và giải quyết xung đột.","answer":false},{"text":"Cộng đồng ASEAN là một hình thức liên kết cao của ASEAN, sẽ từng bước thay thế cho tổ chức để hội nhập sâu rộng với thế giới.","answer":false},{"text":"Vai trò trung tâm của ASEAN trong các cơ chế khu vực được thể hiện chủ yếu qua việc áp đặt các quyết định mang tính bắt buộc đối với các quốc gia đối tác.","answer":false}]},{"n":3,"stem":"Cho bảng thông tin sau đây:","passage":[{"t":"table","rows":[["Thời gian","Hoạt động của ASEAN"],["Năm 1967","Thông qua Tuyên bố Băng Cốc."],["Năm 1997","Thông qua Tầm nhìn ASEAN 2020."],["Năm 2004","Tiến hành Hội nghị cấp cao ASEAN lần thứ 10."],["Năm 2012","Thông qua Tuyên bố nhân quyền ASEAN."],["Năm 2015","Thông qua Tuyên bố Cua-la Lăm-po."],["Năm 2019","Tiến hành Hội nghị Ủy ban Bảo vệ và thúc đẩy quyền phụ nữ và trẻ em ASEAN lần thứ 19."]]}],"items":[{"text":"Từ năm 2004 đến năm 2019, ASEAN đã xây dựng được hệ thống văn bản pháp lý bảo đảm thực thi nghiêm ngặt các chuẩn mực về dân chủ và nhân quyền trong toàn khu vực.","answer":false},{"text":"Việc thành lập Cộng đồng Văn hóa-Xã hội ASEAN có ý nghĩa quan trọng góp phần xây dựng một cộng đồng các dân tộc ASEAN hài hòa, sống đùm bọc chia sẻ, hướng tới người dân và tạo dựng một bản sắc chung của khu vực.","answer":true},{"text":"Tuyên bố Băng Cốc năm 1967 nêu rõ ASEAN là tổ chức liên chính phủ có tư cách pháp nhân, hướng tới mục tiêu xây dựng khu vực Đông Nam Á hòa bình, thịnh vượng.","answer":false},{"text":"Các sự kiện trong bảng thông tin phản ánh một tiến trình liên tục và không gián đoạn của tổ chức ASEAN, trong đó mỗi văn kiện sau đều có tính chất pháp lý cao hơn văn kiện trước.","answer":false}]},{"n":4,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Năm 2020 là năm quan trọng đối với ASEAN để kiểm điểm giữa kỳ công tác triển khai các Kế hoạch Tổng thể để xây dựng Cộng đồng ASEAN 2015 – 2025. Cùng tiến trình xây dựng Cộng đồng được thúc đẩy toàn diện, mạnh mẽ trong 5 năm qua, ASEAN dần vươn lên trở thành lực lượng nòng cốt trong kiến tạo cấu trúc khu vực; lấy hòa bình, ổn định và phồn vinh làm mục đích chung; đoàn kết, thống nhất làm phương châm hành động và đối thoại, hợp tác làm công cụ chính trong quan hệ. Đây là những thành công để các đối tác và cộng đồng quốc tế tôn trọng…”."},{"t":"p","text":"(Lê Minh Tiến, 25 năm hội nhập ASEAN, một chặng đường gắn kết và chủ động thích ứng, Tạp chí Luật học, số 12/2020, tr.15)"}],"items":[{"text":"Đến năm 2020, ASEAN đang trong quá trình triển khai Kế hoạch Tổng thể xây dựng Cộng đồng ASEAN 2015 – 2025.","answer":true},{"text":"Cộng đồng ASEAN được xây dựng và phát triển trước Hiệp hội các quốc gia Đông Nam Á.","answer":false},{"text":"Theo đoạn tư liệu trên, phương châm hành động của ASEAN là không can thiệp vào công việc nội bộ của các nước.","answer":false},{"text":"Việc xây dựng Cộng đồng ASEAN một cách toàn diện và mạnh mẽ là nhân tố quyết định để các đối tác quốc tế tôn trọng vị thế của hiệp hội.","answer":true}]},{"n":5,"stem":"Cho bảng thông tin sau đây:","passage":[{"t":"table","rows":[["Thời gian","Nội dung"],["1967","Tuyên bố Băng Cốc được kí kết, khởi nguồn cho ý tưởng xây dựng Cộng đồng ASEAN."],["1997","Tầm nhìn ASEAN 2020 được thông qua, đề xuất ý tưởng xây dựng một Cộng đồng ASEAN."],["2007","Hiến chương ASEAN được thông qua đã tạo cơ sở pháp lý hình thành Cộng đồng ASEAN."],["2009","Lộ trình xây dựng Cộng đồng ASEAN (2009 - 2015) được thông qua, đưa ra các biện pháp và hoạt động cụ thể xây dựng Cộng đồng ASEAN vào năm 2015."],["2015","Tuyên bố Cua-la Lăm-pơ được kí kết."]]}],"items":[{"text":"Cộng đồng ASEAN chính thức ra đời vào năm 2014 đã hoàn thành sớm hơn so với mục tiêu được đưa ra trong Tầm nhìn ASEAN 2020 (1997).","answer":false},{"text":"Cộng đồng ASEAN là một tổ chức đa quốc gia có quyền thay thế chính phủ các nước thành viên trong việc ra quyết định, hoạt động dựa trên nguyên tắc đồng thuận.","answer":false},{"text":"Cộng đồng ASEAN ra đời đã giúp các nước thành viên chuyển từ thế cạnh tranh sang thế liên kết chặt chẽ, tạo thành một cực tăng trưởng kinh tế năng động và có sức hút hàng đầu thế giới.","answer":false},{"text":"Bảng thông tin đề cập đến quá trình hình thành của Cộng đồng ASEAN.","answer":true}]}]},{"id":4,"title":"Sự hình thành và phát triển của ASEAN","mcq":[{"n":1,"stem":"Năm 1999, quốc gia nào trở thành thành viên thứ 10 của Hiệp hội các quốc gia Đông Nam Á?","passage":[],"options":["Thái Lan.","Mi-an-ma.","Cam-pu-chia.","Ma-lai-xi-a."],"answer":2},{"n":2,"stem":"Hiệp hội các quốc gia Đông Nam Á được thành lập ban đầu với 5 nước thành viên, trong đó không bao gồm","passage":[],"options":["Xin-ga-po.","Việt Nam.","Thái Lan.","In-đô-nê-xi-a."],"answer":1},{"n":3,"stem":"Quốc gia nào sau đây thành viên sáng lập của Hiệp hội các quốc gia Đông Nam Á (ASEAN)?","passage":[],"options":["Mi-an-ma.","Mông Cổ.","Trung Quốc.","Ma-lai-xi-a"],"answer":3},{"n":4,"stem":"Năm 1967, quốc gia nào không tham gia sáng lập Hiệp hội các quốc gia Đông Nam Á (ASEAN)?","passage":[],"options":["Inđônêxia.","Philippin.","Thái Lan.","Ấn Độ."],"answer":3},{"n":5,"stem":"Quốc gia nào sau đây không phải là thành viên của Hiệp hội các quốc gia Đông Nam Á (ASEAN) trong thời kì Chiến tranh lạnh?","passage":[],"options":["Thái Lan.","In-đô-nê-xi-a.","Bru-nây.","Đông Ti-mo."],"answer":3},{"n":6,"stem":"Năm 1994, các nước Đông Nam Á thành lập","passage":[],"options":["Khu vực mậu dịch tự do.","Cộng đồng ASEAN.","Diễn đàn khu vực ASEAN.","Nghị viện ASEAN."],"answer":2},{"n":7,"stem":"Các nước ASEAN đã kí kết văn kiện nào sau đây vào năm 2003?","passage":[],"options":["Tuyên bố Ba-li II.","Tuyên ngôn Quốc tế Nhân quyền.","Hiến chương Liên hợp quốc.","Hiến chương ASEAN."],"answer":0},{"n":8,"stem":"Năm 1967, các nước Đông Nam Á thành lập","passage":[],"options":["tổ chức ASEAN.","Cộng đồng ASEAN.","Diễn đàn khu vực.","Diễn đàn Á-Âu."],"answer":0},{"n":9,"stem":"Năm 1976, ASEAN ra tuyên bố","passage":[],"options":["về sự Hòa hợp ASEAN.","thành lập Cộng đồng ASEAN.","Ba li II.","Khu vực Hòa bình, Tự do và Trung lập."],"answer":0},{"n":10,"stem":"Quá trình phát triển của Hiệp hội các quốc gia Đông Nam Á giai đoạn 1967-1976 chịu tác động của nhân tố nào sau đây?","passage":[],"options":["Chiến tranh Thế giới lan rộng.","Xu thế toàn cầu hóa phát triển mạnh.","Các nước đều lấy kinh tế làm trung tâm.","Hành động xâm lược của chủ nghĩa đế quốc."],"answer":3},{"n":11,"stem":"Các nước Đông Dương gia nhập Hiệp hội các quốc gia Đông Nam Á (ASEAN) trong bối cảnh nào sau đây?","passage":[],"options":["Chủ nghĩa xã hội trở thành hệ thống thế giới.","Bán đảo Triều Tiên được thống nhất trở lại.","Quan hệ Liên Xô - Mỹ đối đầu căng thẳng.","Cuộc Chiến tranh lạnh đã chấm dứt."],"answer":3},{"n":12,"stem":"Điểm nổi bật trong quá trình phát triển của ASEAN từ khi thành lập đến đầu thế kỉ XXI là gì?","passage":[],"options":["Chuyển trọng tâm sang quốc phòng.","Thống nhất về thể chế chính trị.","Từng bước mở rộng thành viên.","Giải quyết vấn đề biên giới lãnh thổ."],"answer":2},{"n":13,"stem":"Năm 2007, tổ chức Hiệp hội các quốc gia Đông Nam Á có hoạt động nào sau đây?","passage":[],"options":["Tuyên bố Băng Cốc hết hiệu lực.","Phát hành đồng tiền chung ASEAN.","Kí Hiệp ước hữu nghị và hợp tác.","Thông qua Hiến chương ASEAN."],"answer":3},{"n":14,"stem":"Quá trình phát triển từ ASEAN 5 đến ASEAN 6 gắn liền với sự kiện","passage":[],"options":["Việt Nam gia nhập ASEAN.","Bru-nây gia nhập ASEAN.","Cam-pu-chia gia nhập ASEAN.","Lào gia nhập ASEAN."],"answer":1},{"n":15,"stem":"Hiệp hội các quốc gia Đông Nam Á (ASEAN) ra đời (1967) nhằm đáp ứng nhu cầu","passage":[],"options":["tạo sự cân bằng sức mạnh với Mỹ.","hợp tác để cùng phát triển.","tăng cường sức mạnh quân sự.","đoàn kết để giải phóng dân tộc."],"answer":1},{"n":16,"stem":"Một trong những nội dung của quá trình phát triển ASEAN giai đoạn 1967 – 1976 là","passage":[],"options":["xây dựng nền móng ban đầu.","bức phá tăng trưởng thần kỳ.","ưu tiên kinh tế hướng nội.","kìm chế xung đột quân sự."],"answer":0},{"n":17,"stem":"Trong giai đoạn 1967 - 1976, Hiệp hội các quốc gia Đông Nam Á (ASEAN) tập trung hợp tác chính trị - an ninh vì một trong những lí do nào sau đây?","passage":[],"options":["Xu thế toàn cầu hóa xuất hiện.","Mỹ sa lầy ở chiến trường Đông Dương.","Cách mạng khoa học công nghệ phát triển.","Vấn đề Campuchia căng thẳng."],"answer":1},{"n":18,"stem":"Các nước Đông Dương gia nhập Hiệp hội các quốc gia Đông Nam Á (ASEAN) trong bối cảnh nào sau đây?","passage":[],"options":["Quan hệ Liên Xô - Mỹ đối đầu căng thẳng.","Chủ nghĩa xã hội trở thành hệ thống thế giới.","Nhiều nước tiến hành cải cách, mở cửa.","Bán đảo Triều Tiên được thống nhất trở lại."],"answer":2},{"n":19,"stem":"Việc các quốc gia Đông Nam Á thành lập ASEAN (1967) chủ yếu phản ánh xu thế nào của khu vực?","passage":[],"options":["Liên kết quốc tế nhằm hạn chế ảnh hưởng của các cường quốc.","Tăng cường hợp tác khu vực để cùng phát triển và ổn định.","Hình thành một nhà nước chung, thống nhất của Đông Nam Á.","Thiết lập một khối quân sự để bảo vệ các nước nhỏ trong khu vực."],"answer":1},{"n":20,"stem":"Hiệp hội các quốc gia Đông Nam Á ra đời trong bối cảnh nào sau đây?","passage":[],"options":["Cuộc chiến tranh xâm lược Việt Nam của Mỹ đã kết thúc.","Trật tự thế giới đa cực, nhiều trung tâm đã được thiết lập.","Xu thế hòa hõa Đông - Tây bắt đầu xuất hiện.","Trật tự thế giới hai cực I-an-ta được xác lập và phát triển."],"answer":3},{"n":21,"stem":"Hiệp hội các quốc gia Đông Nam Á (ASEAN) ra đời trong bối cảnh nào sau đây?","passage":[],"options":["Trật tự thế giới đa cực, nhiều trung tâm đã được thiết lập.","Cuộc Chiến tranh lạnh đang ảnh hưởng đến nhiều nước.","Cuộc chiến tranh xâm lược Việt Nam của Mỹ đã kết thúc.","Trật tự thế giới hai cực I-an-ta đã sụp đổ hoàn toàn."],"answer":1},{"n":22,"stem":"Trong giai đoạn 1976-1999, Hiệp hội các quốc gia Đông Nam Á (ASEAN) đạt được một trong những thành tựu nào sau đây?","passage":[],"options":["Thông qua bản Hiến chương ASEAN.","Thành lập và phát triển Cộng đồng ASEAN.","Thành lập và bước đầu phát triển tổ chức.","Phát triển số lượng thành viên của tổ chức."],"answer":3},{"n":23,"stem":"Tổ chức Hiệp hội các quốc gia Đông Nam Á ra đời (1967) hướng tới mục đích chính là","passage":[],"options":["xây dựng khu vực Đông Nam Á hoà bình và thịnh vượng.","phát động cao trào giải phóng dân tộc ở Đông Nam Á.","hình thành thế cân bằng với tổ chức Liên minh châu Âu.","thiết lập cục diện hai cực và hai phe ở khu vực châu Á."],"answer":0},{"n":24,"stem":"Quá trình hoà giải, hoà nhập và phát triển ở Đông Nam Á được đánh dấu bằng sự kiện nào sau đây?","passage":[],"options":["Tuyên bố Cua-la Lăm-pơ được kí kết (2015).","Thông qua văn kiện Tầm nhìn ASEAN 2020 (1997).","Việt Nam gia nhập tổ chức ASEAN (1995).","Thành lập Khu vực Mậu dịch tự do ASEAN (1992)."],"answer":2},{"n":25,"stem":"Một trong những mục đích thành lập của tổ chức Hiệp hội các quốc gia Đông Nam Á là","passage":[],"options":["thành lập liên minh chính trị, quân sự ở khu vực Đông Nam Á.","hoàn thành mục tiêu phát triển thiên niên kỉ của Liên hợp quốc.","thúc đẩy hợp tác, tích cực giúp đỡ lẫn nhau về kinh tế, văn hoá.","phát động cuộc đấu tranh vì độc lập, tự do của nước thành viên."],"answer":2},{"n":26,"stem":"Từ khi thành lập (1967) đến nay, một trong những tác động quan trọng của Hiệp hội các quốc gia Đông Nam Á (ASEAN) đối với khu vực là","passage":[],"options":["xóa bỏ hoàn toàn sự chênh lệch về trình độ phát triển thông qua cơ chế điều tiết bắt buộc.","thiết lập mô hình liên kết siêu quốc gia, tạo điều kiện cho các nước thành viên phát triển.","thúc đẩy quá trình nhất thể hóa về chính trị và kinh tế giữa các nước trong khu vực.","hình thành cơ chế hợp tác, góp phần duy trì hòa bình, ổn định và thúc đẩy phát triển bền vững."],"answer":3},{"n":27,"stem":"Nội dung nào sau đây là yếu tố thúc đẩy quá trình mở rộng thành viên của ASEAN trong những năm 90 của thế kỉ XX?","passage":[],"options":["Chiến tranh lạnh chấm dứt, Hiệp định hòa bình về Cam-pu-chia được kí kết.","Sự đồng nhất về mô hình chính trị, kinh tế các quốc gia Đông Nam Á.","Sau Chiến tranh lạnh, các quốc gia Đông Nam Á giành được độc lập.","Trật tự hai cực I-an-ta sụp đổ, xu thế liên kết khu vực bắt bắt đầu xuất hiện."],"answer":0},{"n":28,"stem":"Quá trình phát triển của Hiệp hội các quốc gia Đông Nam Á từ năm 1967 đến năm 2015 có đặc điểm nào sau đây?","passage":[],"options":["Xuất phát từ liên minh quân sự phát triển thành tổ chức liên kết kinh tế, chính trị.","Có sự phát triển từng bước về cơ cấu tổ chức, phạm vi và mức độ hợp tác.","Trọng tâm của quá trình hợp tác có sự chuyển dịch từng bước từ nội khối sang ngoại khối.","Quá trình hình thành, phát triển chịu sự chi phối thường xuyên của cuộc Chiến tranh lạnh."],"answer":1},{"n":29,"stem":"Sự kiện ASEAN kết nạp Việt Nam thành thành viên chính thức (1995) có ý nghĩa nào sau đây?","passage":[],"options":["Đánh dấu ASEAN trở thành tổ chức liên kết khu vực bao gồm tất cả quốc gia Đông Nam Á.","Tạo điều kiện để Việt Nam bình thường hóa và thiết lập quan hệ ngoại giao với Trung Quốc.","Tạo lập cơ sở vững chắc để Việt Nam trở thành thành viên của tổ chức Liên Hợp Quốc.","Đưa ASEAN trở thành tổ chức liên kết khu vực đa dạng về mô hình chính trị và ý thức hệ."],"answer":3},{"n":30,"stem":"Việc các nước thành viên Hiệp hội các quốc gia Đông Nam Á kí kết Hiệp ước Ba-li năm 1976 có ý nghĩa nào sau đây?","passage":[],"options":["Kết thúc thời kì đối đầu với các nước Đông Dương.","Hoàn thiện ngôi nhà chung với đầy đủ các nước thành viên.","Góp phần chấm dứt cuộc Chiến tranh lạnh trong khu vực.","Đánh dấu bước ngoặt trong quá trình phát triển của tổ chức."],"answer":3}],"tf":[{"n":1,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Mục tiêu của ASEAN là duy trì và tăng cường hòa bình, an ninh và ổn định khu vực; thúc đẩy tăng trưởng kinh tế, tiến bộ xã hội và phát triển văn hóa; tăng cường hợp tác và hỗ trợ lẫn nhau trong các lĩnh vực kinh tế, xã hội, văn hóa, khoa học – kĩ thuật và hành chính; nâng cao đời sống nhân dân các nước thành viên; củng cố một Cộng đồng ASEAN gắn kết, cùng chia sẻ trách nhiệm.”"},{"t":"p","text":"(Hiệp hội các quốc gia Đông Nam Á, Hiến chương ASEAN, NXB Chính trị quốc gia Sự thật, 2010, tr. 5–6)."}],"items":[{"text":"ASEAN là tổ chức liên kết khu vực của toàn bộ các nước châu Á.","answer":false},{"text":"Duy trì hòa bình và an ninh là mục tiêu chính trị của ASEAN và cũng là mục tiêu của các lực lượng tiến bộ trên thế giới.","answer":true},{"text":"Để xây dựng khu vực tự cường, ASEAN tiến hành phát triển song song quan hệ giữa các thành viên và đẩy mạnh quan hệ với các đối tác bên ngoài, lấy nội lực để phát huy ngoại lực.","answer":true},{"text":"Vì một khu vực không có chiến tranh, ASEAN đã loại bỏ việc phát triển quân sự nhất là vũ khí hạt nhân và các loại vũ khí hủy diệt khác.","answer":false}]},{"n":2,"stem":"Cho đoạn tư liệu sau đây :","passage":[{"t":"p","text":"\"Nhận thức được sự tồn tại của các mối quan tâm lẫn nhau và các vấn đề chung giữa các nước Đông Nam Á và tin tưởng vào sự cần thiết phải tăng cường hơn nữa các mối quan hệ đoàn kết sẵn có trong khu vực; mong muốn xây dựng một nền tảng vững chắc cho hành động chung nhằm thúc đẩy hợp tác khu vực ở Đông Nam Á, các nước Đông Nam Á có trách nhiệm chính trong việc tăng cường ổn định kinh tế và xã hội của khu vực và bảo đảm sự phát triển đất nước hòa bình và tiến bộ, quyết tâm bảo đảm sự ổn định và an ninh không có sự can thiệp từ bên ngoài dưới bất kì hình thức hoặc biểu hiện nào\"."},{"t":"p","text":"(Tuyên bố Băng - cốc ngày 8 - 8 - 1967)"}],"items":[{"text":"Sự ra đời của ASEAN phản ánh xu thế liên kết khu vực để c ng phát triển và giữ vững tính độc lập, tự chủ trước tác động bên ngoài.","answer":true},{"text":"Mục tiêu của các nước Đông Nam Á là xóa bỏ quan hệ giữa từng quốc gia để hình thành một thể thống nhất, muốn tự chủ giải quyết các vấn đề khu vực.","answer":false},{"text":"Tuyên bố Băng - cốc đóng vai trò là Hiến chương của ASEAN từ khi thành lập cho đến năm 2009.","answer":false},{"text":"Theo tư liệu, việc giữ vững ổn định kinh tế, xã hội là trách nhiệm của chính các nước Đông Nam Á.","answer":true}]},{"n":3,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Trải qua hơn ba thập niên phát triển, kể từ khi thành lập đến nay, tuy gặp nhiều khó khăn, phức tạp về chính trị, kinh tế, chịu sức ép của các nước lớn từ nhiều phía, nhưng tổ chức ASEAN đã tồn tại và phát triển với nhiều triển vọng tốt đẹp ở khu vực Đông Nam Á và trên thế giới. Từ một tổ chức không tên tuổi, liên kết các quốc gia nhỏ, yếu trong khu vực để đối phó với những thách thức từ bên trong và bên ngoài, trong đó trước hết là các thách thức về an ninh và kinh tế để bảo vệ sự tồn tại của mình, ngày nay ASEAN đã trở thành một tổ chức có uy tín lớn trên thế giới”."},{"t":"p","text":"(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục Việt Nam, Hà Nội, 1998, tr. 363)."}],"items":[{"text":"Từ khi mới thành lập, tổ chức ASEAN đã nhận được sự ủng hộ của các nước lớn từ nhiều phía.","answer":false},{"text":"ASEAN là một tổ chức quốc tế ngày càng phát triển và được nhiều nước công nhận.","answer":false},{"text":"Tổ chức ASEAN ra đời phản ánh xu thế của thế giới và là tất yếu của các nước trong khu vực vào những thập niên cuối thế kỉ XX.","answer":true},{"text":"Với tư cách là một tổ chức có uy tín lớn trên thế giới ngày nay, ASEAN hỗ trợ các nước thành viên giải quyết hoàn toàn các thách thức về an ninh và kinh tế.","answer":false}]},{"n":4,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Dựa trên những nỗ lực của ASEAN nói chung và các thành viên nói riêng, cùng với niềm hy vọng, sự mong đợi và ước mơ của hơn 650 triệu nhân dân Đông Nam Á, hiện thực về một Cộng đồng chung đang dần được định hình rõ nét hơn. Mặc dù còn nhiều khó khăn thách thức, song với chất keo kết dính gồm ba trụ cột là chính trị - an ninh, kinh tế, văn hóa - xã hội, ASEAN sẽ tạo nên một viễn cảnh tốt đẹp, đó là “một ASEAN dựa trên luật lệ, hướng tới người dân, lấy người dân làm trung tâm, một ASEAN của “Một tầm nhìn, một bản sắc, một cộng đồng\"."},{"t":"p","text":"(Trần Xuân Hiệp, Trương Công Vĩnh Khanh, ASEAN: 55 năm hình thành và phát triển (1967-2022), NXB Thông tin và Truyền thông, 2022, tr.333)"}],"items":[{"text":"Cộng đồng ASEAN phản ánh bước phát triển mới của tổ chức ASEAN nhằm thu hẹp sự khác biệt giữa các nước trong khu vực về chính trị.","answer":false},{"text":"Tư liệu phản ánh mục tiêu, nguyên tắc hoạt động của Hiệp hội các quốc gia Đông Nam Á (ASEAN).","answer":false},{"text":"Cộng đồng Chính trị - An ninh, Cộng đồng kinh tế, Cộng đồng Văn hóa - Xã hội là những tổ chức hợp tác mới, thúc đẩy ASEAN thực hiện mục tiêu nhất thể hóa khu vực.","answer":false},{"text":"Ba trụ cột của Cộng đồng ASEAN đều hướng đến mục tiêu chung là đảm bảo hòa bình, ổn định và phát triển của khu vực Đông Nam Á.","answer":true}]},{"n":5,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Sau khi giành được độc lập, các nước Đông Nam Á có dự định thành lập một tổ chức khu vực nhằm tạo điều kiện cho sự hợp tác, phát triển trên các lĩnh vực kinh tế, khoa học kĩ thuật và văn hóa; đồng thời, hạn chế ảnh hưởng của các nước lớn đang tìm mọi cách để biến Đông Nam Á thành “sân sau” của họ. Trong quá trình tìm kiếm sự hợp tác giữa các nước Đông Nam Á đã xuất hiện những tổ chức khu vực và kí kết các hiệp ước giữa các nước trong khu vực. […] Sau nhiều cuộc thảo luận, tháng 8-1967, ngoại trưởng năm nước: Thái Lan, Inđônêxia, Philippin, Malaixia và Xingapo đã họp ở Băng Cốc vào ngày 8-8-1967, đã ra tuyên bố về việc thành lập Hiệp hội các nước Đông Nam Á (viết tắt tiếng Anh là ASEAN)”."},{"t":"p","text":"(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, 2006, tr.358)"}],"items":[{"text":"Tổ chức ASEAN được thành lập nhằm đối phó với những thách thức về an ninh và kinh tế từ bên trong và bên ngoài.","answer":true},{"text":"Tổ chức ASEAN được thành lập trong bối cảnh xu thế liên kết khu vực và xu thế toàn cầu hóa đang diễn ra mạnh mẽ.","answer":false},{"text":"ASEAN là tổ chức liên kết khu vực ở Đông Nam Á, được thành lập vào thập niên 60 của thế kỉ XIX.","answer":false},{"text":"Những nước sáng lập tổ chức ASEAN có trình độ phát triển tương đối đồng đều nhưng khác nhau về thể chế chính trị.","answer":true}]}]},{"id":3,"title":"Trật tự thế giới sau Chiến tranh lạnh","mcq":[{"n":1,"stem":"Trong quá trình hình thành trật tự thế giới theo xu thế đa cực, quốc gia nào sau đây là một trong những trung tâm quyền lực mới nổi?","passage":[],"options":["Phần Lan.","Liên Xô.","Ấn Độ.","Chi-lê"],"answer":2},{"n":2,"stem":"Một trong những trung tâm quyền lực của xu thế đa cực hiện nay là","passage":[],"options":["Trung Quốc.","Mông Cổ.","Thái Lan.","Lào."],"answer":0},{"n":3,"stem":"Nội dung nào sau đây phản ánh đúng một trong những xu thế phát triển của thế giới trong thập niên đầu sau Chiến tranh lạnh?","passage":[],"options":["Trật tự thế giới đơn cực được xác lập.","Tăng cường xây dựng liên minh quân sự.","Các nước tăng cường chạy đua vũ trang.","Xu thế đối thoại, hòa bình và hợp tác."],"answer":3},{"n":4,"stem":"Nội dung nào sau đây phản ánh đúng sự điều chỉnh quan hệ giữa các nước có chế độ chính trị khác nhau sau khi Chiến tranh lạnh chấm dứt?","passage":[],"options":["Hòa hoãn, đối thoại, cùng phát triển.","Thiết lập quan hệ đối tác chiến lược.","Giảm dần cuộc chạy đua vũ trang.","Giảm dần sự cạnh tranh về kinh tế."],"answer":0},{"n":5,"stem":"Sau Chiến tranh lạnh, các quốc gia nào sau đây là một trong những trung tâm quyền lực đang vươn lên khẳng định sức mạnh về kinh tế, quân sự và chính trị đối với quốc tế?","passage":[],"options":["Nhật Bản và Triều Tiên.","Trung Quốc và Ấn Độ.","Mỹ và Ai Cập.","Nga và Thái Lan."],"answer":1},{"n":6,"stem":"Nhóm G20 ra đời năm 1999 với sự tham gia của 20 nước có nền kinh tế lớn nhất thế giới là một trong những biểu hiện của","passage":[],"options":["hợp tác quân sự.","xu thế đa cực.","Chiến tranh lạnh.","xu thế đơn cực."],"answer":1},{"n":7,"stem":"Sau Chiến tranh lạnh, các nước điều chỉnh quan hệ với nhau theo chiều hướng hòa hoãn, đối thoại, hợp tác chủ yếu là do","passage":[],"options":["kinh tế Liên Xô lâm vào khủng hoảng.","Mỹ và Liên Xô hạn chế chạy đua vũ trang.","nhu cầu ổn định để phát triển kinh tế.","trật tự hai cực I-an-ta đã được xác lập."],"answer":2},{"n":8,"stem":"Sau khi Chiến tranh lạnh chấm dứt, tổ chức nào sau đây đã nỗ lực vươn lên trở thành một cực trong trật tự thế giới đa cực?","passage":[],"options":["Tổ chức Hiệp ước Bắc Đại Tây Dương.","Liên minh châu Âu.","Hội đồng tương trợ kinh tế.","Diễn đàn hợp tác Á – Âu."],"answer":1},{"n":9,"stem":"Trong xu thế phát triển chung của thế giới hiện nay, thời cơ Việt Nam có thể tận dụng để xây dựng và phát triển đất nước là gì?","passage":[],"options":["Không bị áp dụng luật chống bán phá giá.","Môi trường hòa bình, ổn định trong khu vực.","Mua được các bằng phát minh với giá rẻ.","Thu hút vốn, tiếp thu thành tựu khoa học."],"answer":3},{"n":10,"stem":"Nhận định nào sau đây đúng về quan hệ quốc tế thời kì sau Chiến tranh lạnh","passage":[],"options":["Cạnh tranh giữa các cường quốc chuyển sang mềm dẻo, phức tạp.","Lợi ích của các dân tộc không còn chi phối chính sách đối ngoại.","Sự sụp đổ của hai cực I-an-ta đã tạo ra trật tự đa cực hoàn chỉnh.","Sự đối đầu gay gắt giữa Mỹ và Liên về mục tiêu chiến lược."],"answer":0},{"n":11,"stem":"Nội dung nào sau đây phản ánh đúng đặc điểm của xu thế đa cực trong quan hệ quốc tế đầu thế kỉ XXI?","passage":[],"options":["Sức mạnh kinh tế là điều kiện cần để trở thành một cực trong xu thế đa cực.","Sức mạnh kinh tế không liên quan đến địa vị chính trị của một cường quốc.","Sức mạnh kinh tế là yếu tố duy nhất quyết định địa vị của một cường quốc.","Quân sự không phải yếu tố quan trọng để đánh giá sức mạnh tổng hợp quốc gia."],"answer":0},{"n":12,"stem":"Các nước sáng lập ASEAN thông qua Tuyên bố Băng Cốc (1967) thể hiện nội dung nào sau đây?","passage":[],"options":["Chấm dứt thời kì chia rẽ, ASEAN trở thành tổ chức liên chính phủ có tư cách pháp nhân.","Sự thích ứng, linh hoạt của các nước ASEAN trong bối cảnh Chiến tranh lạnh.","Thiết lập được khuôn khổ thể chế và hoàn chỉnh cơ sở pháp lí cho ASEAN.","Ý tưởng về một Cộng đồng các quốc gia khu vực Đông Nam Á đã được hiện thực hóa."],"answer":3},{"n":13,"stem":"Từ sau năm 1991, trong bối cảnh trật tự thế giới mới dần hình thành theo xu thế đa cực, Việt Nam cần","passage":[],"options":["phát huy tốt vai trò của các lực lượng hòa bình, dân chủ, tiến bộ trên thế giới.","tranh thủ sự ủng hộ của các cường quốc có ảnh hưởng lớn trong quan hệ quốc tế.","hợp tác với các nước lớn để giải quyết vấn đề chung, tăng sự phụ thuộc lẫn nhau.","thực hiện ngoại giao linh hoạt, tranh thủ thuận lợi, giữ vững mục tiêu độc lập."],"answer":3},{"n":14,"stem":"Sự hình thành trật tự thế giới theo xu thế đa cực sau Chiến tranh lạnh đã","passage":[],"options":["cản trở các nước đang phát triển đa phương hoá chính sách đối ngoại.","thay đổi quan hệ giữa các nước lớn theo hướng từ đối tác sang đối tượng.","tạo ra nhiều cơ hội lựa chọn đối tác cho các quốc gia đang phát triển.","buộc Mỹ phải từ bỏ chạy đua vũ trang và mục tiêu làm bá chủ thế giới."],"answer":2},{"n":15,"stem":"Sau Chiến tranh lạnh, yếu tố nào sau đây đã thúc đẩy xu thế đối thoại, cùng hợp tác trong quan hệ quốc tế?","passage":[],"options":["Mỹ có quyền lực áp đảo, chi phối trật tự đa cực.","Sự phát triển mạnh mẽ của xu thế toàn cầu hóa.","Nhu cầu ổn định để khôi phục trật tự thế giới cũ của các quốc gia.","Hầu hết các quốc gia điều chỉnh chiến lược tập trung vào quân sự."],"answer":1},{"n":16,"stem":"Nhận định nào sau đây phản ánh đúng đặc điểm của quan hệ quốc tế từ sau Chiến tranh thế giới thứ hai đến nay?","passage":[],"options":["Trật tự thế giới đơn cực xác lập sự thống trị tuyệt đối của Mỹ đối với các liên minh kinh tế.","Cấu trúc quyền lực chuyển dịch từ trạng thái hai cực sang xu thế đa cực, nhiều trung tâm.","Xung đột về ý thức hệ là nhân tố duy nhất chi phối sự vận động của quan hệ quốc tế.","Xu thế toàn cầu hóa đã triệt tiêu hoàn toàn những mâu thuẫn về lợi ích giữa các quốc gia."],"answer":1},{"n":17,"stem":"Sau Chiến tranh lạnh, quan hệ giữa các quốc gia có chế độ chính trị-xã hội khác nhau có một trong những đặc điểm nào sau đây?","passage":[],"options":["Phụ thuộc vào sự can thiệp của các tổ chức quốc tế.","Bị cắt đứt hoàn toàn do cạnh tranh kinh tế gay gắt.","Căng thẳng với đối đầu vì có sự khác biệt về thể chế.","Được mở rộng hợp tác trên cơ sở tôn trọng lẫn nhau."],"answer":3},{"n":18,"stem":"Nội dung nào sau đây không phải là biểu hiện của xu thế đa cực trong quan hệ quốc tế sau Chiến tranh lạnh?","passage":[],"options":["Ấn Độ trở thành cường quốc kinh tế, quân sự, khoa học - kĩ thuật.","Các công ty xuyên quốc gia có ảnh hưởng lớn đến kinh tế toàn cầu.","Nhiều trung tâm kinh tế, tài chính ngày càng phát triển, lớn mạnh.","Nhật Bản vươn lên trở thành một cường quốc về kinh tế, quân sự."],"answer":3},{"n":19,"stem":"Nội dung nào sau đây không phản ánh đúng xu thế đối thoại, hợp tác trong quan hệ quốc tế sau khi chiến tranh lạnh chấm dứt?","passage":[],"options":["Các nước điều chỉnh quan hệ theo hướng hòa bình, hòa hoãn và đối thoại.","Các nước xây dựng quan hệ hợp tác lâu dài trên cơ sở hai bên cùng có lợi.","Các nước giải quyết bất đồng và mâu thuẫn bằng thương lượng hòa bình.","Các nước cùng với nhau để xây dựng tổ chức quân sự lớn ở các châu lục."],"answer":3},{"n":20,"stem":"Nội dung nào sau đây là đặc điểm nổi bật trong xu thế hợp tác quốc tế sau Chiến tranh lạnh?","passage":[],"options":["Hợp tác dựa trên nguyên tắc hai bên cùng có lợi, cùng tồn tại hòa bình.","Gắn chặt việc hợp tác kinh tế với các hoạt động quân sự đa phương.","Có sự nhất thể hóa về chế độ chính trị giữa các nước hợp tác với nhau.","Ưu tiên lợi ích của quốc gia, dân tộc dẫn đến sự cạnh tranh gay gắt."],"answer":0},{"n":21,"stem":"Một trong những biểu hiện của xu thế đối thoại, hợp tác trong quan hệ quốc tế sau Chiến tranh lạnh là","passage":[],"options":["sự hợp nhất của các công ty thành các tập đoàn lớn.","sự suy giảm sức mạnh tương đối của nước Mĩ.","sự phát triển nhanh của quan hệ thương mại quốc tế.","giải quyết tranh chấp bằng biện pháp hòa bình."],"answer":3},{"n":22,"stem":"Trong trật tự thế giới sau Chiến tranh lạnh, sự phát triển các tổ chức quốc tế, khu vực (như EU, ASEAN, WTO…) phản ánh","passage":[],"options":["vai trò lãnh đạo, chi phối nền kinh tế thế giới của Mỹ.","vị thế và ảnh hưởng lớn của các nước công nghiệp mới.","gia tăng vai trò các lực lượng mới trong quan hệ quốc tế.","sự xuất hiện và phát triển mạnh của xu thế toàn cầu hóa."],"answer":2},{"n":23,"stem":"Một trong những điểm chung của các trật tự thế giới được hình thành trong và sau Chiến tranh lạnh là đều","passage":[],"options":["dựa trên sự thỏa thuận giữa các nước có cùng chế độ chính trị.","bảo đảm quyền dân tộc cơ bản của các nước trên thế giới.","phản ánh tương quan lực lượng giữa hai hệ thống chính trị đối lập.","thiết lập trên cơ sở thực lực của các nước trên thế giới."],"answer":3},{"n":24,"stem":"Nội dung nào dưới đây không phản ánh đúng xu thế phát triển của thế giới sau Chiến tranh lạnh?","passage":[],"options":["Các cuộc xung đột quân sự vẫn còn diễn ra ở một số khu vực.","Các nước ra sức chạy đua vũ trang để khẳng định sức mạnh.","Các nước điều chỉnh chiến lược tập trung phát triển kinh tế.","Một trật tự thế giới mới đang hình thành theo hướng đa cực."],"answer":1},{"n":25,"stem":"Sau khi Trật tự hai cực lanta tan rã, yếu tố nào sau đây thúc đẩy xu thế đối thoại, hợp tác trong quan hệ quốc tế?","passage":[],"options":["Cân bằng tương quan thế và lực, các nước lớn chuyển từ cạnh tranh sang đối thoại, hợp tác.","Ý thức về nền hòa bình, ổn định bền vững đã hóa giải mọi tranh chấp, xung đột trên thế giới","Xu thế toàn cầu hóa xuất hiện, các quốc gia phải điều chỉnh chiến lược hội nhập quốc tế.","Nhu cầu kiến tạo môi trường hòa bình, ổn định để tăng sức mạnh tổng hợp của quốc gia."],"answer":3},{"n":26,"stem":"Một trong những xu thế nổi bật của thế giới sau Chiến tranh lạnh là","passage":[],"options":["tăng cường chạy đua vũ trang giữa các cường quốc.","các cường quốc ra sức mở rộng hệ thống thuộc địa.","trật tự thế giới hai cực từng bước xác lập, phát triển.","kinh tế trở thành trọng tâm phát triển của các nước."],"answer":3},{"n":27,"stem":"Nhận định nào sau đây không đúng về quan hệ quốc tế thời kỳ sau Chiến tranh lạnh?","passage":[],"options":["Xu thế đối thoại, hợp tác thay thế cho xu thế đối đầu giữa các nước về ý thức hệ.","Các nước Trung Quốc, Nga, Ấn Độ, Nhật Bản gia tăng sức mạnh và tầm ảnh hưởng.","Cách mạng công nghiệp lần thứ hai và xu thế toàn cầu hóa đang diễn ra mạnh mẽ.","Vai trò của các trung tâm, tổ chức kinh tế, tài chính quốc tế ngày càng gia tăng."],"answer":2},{"n":28,"stem":"Từ sau Chiến tranh lạnh, hầu hết các quốc gia điều chỉnh chiến lược phát triển lấy kinh tế làm trọng điểm vì","passage":[],"options":["hòa bình và an ninh thế giới được bảo vệ ở mức cao nhất.","kinh tế trở thành nội dung căn bản trong quan hệ quốc tế.","giữa các cường quốc đã chấm dứt việc chạy đua vũ trang.","sức mạnh quốc gia không dựa trên lực lượng quốc phòng."],"answer":1},{"n":29,"stem":"Nội dung nào sau đây phản ánh đúng đặc điểm của trật tự thế giới mới được hình thành sau khi trật tự hai cực I-an-ta sụp đổ?","passage":[],"options":["Mỹ và Trung Quốc là hai siêu cường nắm hoàn toàn quyền chi phối các quan hệ quốc tế.","Vai trò, sức mạnh của các trung tâm, tổ chức kinh tế, tài chính quốc tế, khu vực bị suy giảm.","Các trung tâm kinh tế đang vươn lên mạnh mẽ để khẳng định vai trò trong quan hệ quốc tế.","Sự hình thành trật tự bị chi phối bởi kết quả của các cuộc đấu tranh giành độc lập dân tộc."],"answer":2},{"n":30,"stem":"Sự hình thành trật tự thế giới đa cực sau Chiến tranh lạnh đã","passage":[],"options":["ngăn cản các nước đang phát triển đa phương hoá quan hệ đối ngoại.","tạo ra nhiều cơ hội lựa chọn đối tác cho các quốc gia đang phát triển.","làm cho các nước đang phát triển gia tăng tính phụ thuộc vào một trong hai cực.","tạo cơ hội để các nước đang phát triển ngăn chặn ý đồ chi phối của các nước lớn."],"answer":1}],"tf":[{"n":1,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Sau khi Chiến tranh lạnh kết thúc, so sánh lực lượng trên bình diện toàn cầu từ chỗ cân bằng giữa hai hệ thống chính trị – xã hội đối lập nay chuyển sang trạng thái mất cân bằng theo hướng có lợi cho Mĩ và phương Tây. Tuy nhiên, tình hình quốc tế đã không phát triển một cách hòa bình, ổn định như người ta mong đợi. Sự đối đầu Đông – Tây về hệ tư tưởng, chính trị, quân sự, kinh tế [...] đã từng chi phối đời sống quốc tế trong suốt thời kỳ Chiến tranh lạnh, nay được chuyển hóa dưới những hình thức khác, bên cạnh sự nổi lên của những mâu thuẫn mới. Sự vận động của các mâu thuẫn này sẽ quyết định diện mạo của trật tự thế giới và xu hướng phát triển của quan hệ quốc tế sau Chiến tranh lạnh.”"},{"t":"p","text":"(Trần Thị Vinh (Chủ biên), Lịch sử thế giới hiện đại (Quyển 2), NXB Đại học Sư phạm, Hà Nội, 2008, tr. 102–103)"}],"items":[{"text":"Sự hình thành của trật tự thế giới mới sau Chiến tranh lạnh vô cùng phức tạp và chậm chạp chủ yếu vì sự đối đầu giữa hai hệ thống chính trị - xã hội đối lập.","answer":false},{"text":"Đoạn tư liệu trên thể hiện sự vận động và phát triển của tình hình thế giới sau Chiến tranh lạnh.","answer":true},{"text":"Sự vận động của các mâu thuẫn sau Chiến tranh lạnh đã làm cho môi trường an ninh quốc tế vô cùng căng thẳng, bùng nổ các cuộc chiến tranh thế giới.","answer":false},{"text":"Mâu thuẫn về lợi ích quốc gia và dân tộc là một trong những yếu tố quan trọng, tác động đến việc hình thành trật tự thế giới mới sau Chiến tranh lạnh.","answer":true}]},{"n":2,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Thế giới phát triển nhanh chóng theo hướng đa cực, tuy vậy cục diện đa cực chưa hẳn đã hình thành mà đang trải qua thời kỳ quá độ từ trật tự cũ để tiến tới một trật tự mới. Có người dự đoán thời kỳ quá độ này phải kéo dài trong nhiều năm, có thể từ 30 đến 50 năm, bởi sự chuyển đổi cục diện thế giới lần này mang đặc điểm mới, quan trọng nhất là không trải qua chiến tranh như các cục diện trước kia. Thế giới đang trong tình hình \"một siêu cường, nhiều cường quốc\", đó là các nước Mỹ, Tây Âu (EU), Nhật Bản, Nga và Trung Quốc”."},{"t":"p","text":"(Vũ Dương Ninh, Một số chuyên đề Lịch sử thế giới, NXB Đại học Quốc gia Hà Nội, 2002, tr. 399)"}],"items":[{"text":"Đoạn tư liệu trên thể hiện cục diện chính trị thế giới sau khi Chiến tranh lạnh chấm dứt.","answer":true},{"text":"Cục diện “một siêu cường, nhiều cường quốc” là biểu hiện cụ thể và là giai đoạn quá độ của xu hướng đa cực sau khi Chiến tranh lạnh chấm dứt.","answer":true},{"text":"Cục diện chính trị thế giới sau Chiến tranh lạnh đã cho thấy trật tự thế giới đa cực đã được xác lập trên thế giới thay thế cho trật tự đơn cực.","answer":false},{"text":"Để tạo nên sự cân bằng quyền lực giữa các trung tâm quyền lực sau Chiến tranh lạnh, hầu hết các nước trên thế giới đều ủng hộ cục diện “một siêu cường, nhiều cường quốc”.","answer":false}]},{"n":3,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Thế giới phát triển nhanh chóng theo hướng đa cực, tuy vậy cục diện đa cực chưa hẳn đã hình thành mà đang trải qua thời kỳ quá độ từ Trật tự cũ để tiến tới một Trật tự mới. Có người dự đoán thời kỳ quá độ này phải kéo dài trong nhiều năm, có thể từ 30 đến 50 năm, bởi sự chuyển đổi cục diện thế giới này mang đặc điểm mới, quan trọng nhất là không trải qua chiến tranh như các cục diện trước kia. Thế giới đang trong tình hình \"một siêu cường, nhiều cường quốc\", đó là các nước Mỹ, Tây Âu (EU), Nhật Bản, Nga và Trung Quốc”."},{"t":"p","text":"(Vũ Dương Ninh, Một số chuyên đề Lịch sử thế giới, NXB Đại học Quốc gia Hà Nội, 2002, tr.399)"}],"items":[{"text":"Sau Chiến tranh lạnh, quan hệ quốc tế phát triển theo xu hướng đa cực.","answer":true},{"text":"Trật tự thế giới đa cực đã được xác lập trên thế giới thay thế cho trật tự đơn cực.","answer":false},{"text":"Một trong những “đặc điểm mới” mà tư liệu xác định là sức mạnh kinh tế của mỗi quốc gia trong trật tự đa cực.","answer":true},{"text":"Trật tự đa cực có nét tương đồng với các trật tự thế giới trước đó vì đều được xác lập bởi các cuộc chiến tranh.","answer":false}]},{"n":4,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Xu thế toàn cầu hóa và khu vực hóa, vốn đã được bắt đầu từ trong thời kì Chiến tranh lạnh, nhưng bị kiềm chế dưới tác động của Chiến tranh lạnh, này trở nên mạnh mẽ hơn bao giờ hết. Toàn cầu hóa mà trước hết và thực chất là toàn cầu hóa kinh tế đang trở thành một đặc trưng chủ yếu của sự phát triển thể giới. Xu thế toàn cầu hóa là xu thế khách quan, tất yếu, không thể đảo ngược được. Toàn cầu hóa mang lại nhiều cơ hội nhưng cũng hàm chứa không ít thách thức to lớn đối với các quốc gia, đặc biệt là các nước đang phát triển”."},{"t":"p","text":"(Trần Thị Vinh (Chủ biên), Lịch sử thế giới hiện đại, quyển 2, NXB Đại học Sư phạm, Hà Nội, 2016, tr.98)"}],"items":[{"text":"Đoạn tư liệu phản ánh xu thế toàn cầu hóa và khu vực hóa xuất hiện sau khi Chiến tranh lạnh kết thúc.","answer":false},{"text":"Toàn cầu hóa về kinh tế đòi hỏi các nước phải tiến hành cải cách sâu rộng để nâng cao sức cạnh tranh và hiệu quả nền kinh tế.","answer":true},{"text":"Trong xu thế toàn cầu hóa, các nước phát triển nhờ có lợi thế vượt trội nên không phải đối mặt với những tác động tiêu cực của xu thế này.","answer":false},{"text":"Một trong những mặt trái của xu thế toàn cầu hóa là làm cho mọi hoạt động và đời sống của con người kém an toàn.","answer":true}]},{"n":5,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Cục diện thế giới hiện nay (từ đầu thế kỷ XXI đến nay), vừa chứa đựng một số đặc điểm kế thừa từ các cục diện trước đó, vừa có biểu hiện mới của đặc điểm cũ và cả những đặc điểm mới. Rõ nhất là đặc điểm đa cực, đa trung tâm: hiển nhiên đã từng xuất hiện từ những năm cuối thế kỷ XX, nhưng từ khi Trung Quốc trở thành nền kinh tế thứ hai thế giới (năm 2010), tương quan quyền lực giữa các cực, các trung tâm đã khác hẳn, tạo cơ sở cho quyết định chấm dứt thời kỳ “giấu mình, chờ thời” (năm 2017) của cường quốc đang trỗi dậy."},{"t":"p","text":"Cuộc cạnh tranh chiến lược Mỹ - Trung ở khu vực châu Á - Thái Bình Dương trong những năm vừa qua có thể được xem như đặc điểm mới của cục diện thế giới hiện nay, mặc dù đã manh nha từ nhiều năm trước”."},{"t":"p","text":"(Nguyễn Viết Thảo, Bối cảnh hình thành và đặc điểm nổi bật của cục diện thế giới hiện nay, Tạp chí Lí luận chính trị - Số 541 (03/2023), tr. 151)."}],"items":[{"text":"Từ đầu thế kỷ XXI đến năm 2017, Mỹ, Trung Quốc là những cường quốc đang trỗi dậy, đại diện cho chính sách “giấu mình, chờ thời” của các nước lớn trong quan hệ quốc tế.","answer":false},{"text":"Sau Chiến tranh lạnh, trật tự đa cực nhiều trung tâm dần hình thành với ưu thế tuyệt đối thuộc về Mỹ và Trung Quốc.","answer":false},{"text":"Cục diện thế giới hiện nay vừa kế thừa yếu tố cũ, vừa xuất hiện đặc điểm mới, nổi bật là xu hướng đa cực và cạnh tranh chiến lược giữa các cường quốc.","answer":true},{"text":"Sự vươn lên mạnh mẽ của các cường quốc là một trong những nhân tố tác động đến quá trình hình thành trật tự thế giới mới sau Chiến tranh lạnh.","answer":true}]}]},{"id":2,"title":"Trật tự thế giới trong Chiến tranh lạnh","mcq":[{"n":1,"stem":"Ranh giới phân chia phạm vi chiếm đóng Triều Tiên của Mỹ và Liên Xô được hội nghị Ianta (2/1945) quy định thuộc","passage":[],"options":["vĩ tuyến 38.","vĩ tuyến 16.","vĩ tuyến 13.","vĩ tuyến 17."],"answer":0},{"n":2,"stem":"Hội nghị I-an-ta (tháng 02 – 1945) có sự tham gia của một trong những quốc gia nào sau đây?","passage":[],"options":["Anh.","Pháp.","Trung Quốc.","Ba Lan."],"answer":0},{"n":3,"stem":"Nguyên thủ của những quốc gia nào sau đây cùng tuyên bố chấm dứt Chiến tranh lạnh vào năm 1989?","passage":[],"options":["Pháp và Nhật Bản.","Anh và Hà Lan.","Ấn Độ và Ai Cập.","Mỹ và Liên Xô."],"answer":3},{"n":4,"stem":"Quyết định “Đông Nam Á thuộc phạm vi ảnh hưởng truyền thống của các nước phương Tây” được thông qua trong hội nghị quốc tế nào sau đây?","passage":[],"options":["I-an-ta (Liên Xô).","Pốt-xđam (Đức).","Xan Phran-xi-xcô (Mĩ).","Tê-hê-ran (I-ran)."],"answer":0},{"n":5,"stem":"Theo quyết định của hội nghị I-an-ta (2 – 1945), lực lượng nào sau đây sẽ bị tiêu diệt?","passage":[],"options":["Chủ nghĩa thực dân.","Chủ nghĩa phát xít.","Chủ nghĩa đế quốc.","Chủ nghĩa xã hội."],"answer":1},{"n":6,"stem":"Vào đầu những năm 70 của thế kỷ XX, Trật tự thế giới hai cực I-an-ta có biểu hiện suy yếu với sự xuất hiện của xu thế","passage":[],"options":["cạnh tranh Âu - Mỹ.","đối đầu Bắc - Nam.","hợp tác Âu - Phi.","hòa hoãn Đông - Tây."],"answer":3},{"n":7,"stem":"Nhận xét nào sau đây là đúng về đặc điểm nổi bật của quan hệ Liên Xô và Mỹ từ đầu những năm 70 của thế kỷ XX đến năm 1991?","passage":[],"options":["Đối đầu trên mọi phương diện.","Vừa đối đầu vừa đối thoại và hợp tác.","Đối thoại hòa bình là xu thế chủ đạo.","Hình thành liên minh chống phát xít."],"answer":1},{"n":8,"stem":"Những năm 70 của thế kỉ XX, sự xuất hiện của xu thế nào sau đây đã ảnh hưởng đến cục diện Chiến tranh lạnh?","passage":[],"options":["Công nghiệp hoá.","Đa cực.","Đơn cực.","Hoà hoãn Đông - Tây."],"answer":3},{"n":9,"stem":"Sự sụp đổ của Trật tự thế giới hai cực I-an-ta không đưa đến tác động nào sau đây?","passage":[],"options":["Dẫn đến sự hình thành trật tự thế giới mới theo xu thế đa cực.","Mở ra điều kiện giải quyết các tranh chấp bằng con đường hòa bình.","Vai trò của các cường quốc, các trung tâm kinh tế ngày càng tăng.","Đưa Mỹ trở thành siêu cường duy nhất trong quan hệ quốc tế."],"answer":3},{"n":10,"stem":"Trật tự thế giới hai cực I-an-ta được hình thành bắt nguồn từ những quyết định và thoả thuận của","passage":[],"options":["Liên Xô và Mỹ ở Hội nghị Xan Phran-xi-xcô (1945).","Hội nghị I-an-ta và Hội nghị Pốt-xdam (1945).","Hội nghị Tê-hê-ran (1943) và Hội nghị I-an-ta (1945).","Liên Xô, Mỹ, Anh trong Hội nghị Tê-hê-ran (1943)."],"answer":1},{"n":11,"stem":"Một trong những quyết định quan trọng của Hội nghị I-an-ta (1945) là","passage":[],"options":["phân chia thành.","Sự phát triển mạnh của khoa học do cách mạng công nghiệp 4.0 mang lại."],"answer":1},{"n":22,"stem":"Một trong những nguyên nhân dẫn đến sự sụp đổ của Trật tự thế giới hai cực I-an-ta là do","passage":[],"options":["sự vươn lên mạnh mẽ của nhiều nước trên thế giới.","công cuộc cải tổ của Liên Xô đã diễn ra thành công.","Mỹ không còn là cường quốc số một trên thế giới.","Nhật Bản vươn lên thành một cực đối đầu với Mỹ."],"answer":0},{"n":23,"stem":"Thắng lợi của phong trào giải phóng dân tộc trên thế giới và sự ra đời của hàng loạt các quốc gia độc lập đã","passage":[],"options":["đánh dấu trật tự hai cực I-an-ta sụp đổ hoàn toàn.","góp phần làm suy yếu trật tự thế giới hai cực I-an-ta.","tăng cường phạm vi ảnh hưởng của Mĩ và Liên Xô.","làm sụp đổ hoàn toàn chế độ xã hội chủ nghĩa ở Liên Xô."],"answer":1},{"n":24,"stem":"Quyết định nào sau đây của Hội nghị I-an-ta (tháng 02 – 1945) tạo nên những bất lợi cho cách mạng Việt Nam trong những năm 1945 – 1946?","passage":[],"options":["Đông Nam Á vẫn thuộc phạm vi ảnh hưởng của các nước phương Tây.","Quân Anh cùng với quân Pháp làm nhiệm vụ giải giáp quân đội Nhật.","Quân Anh và quân Trung Hoa Dân quốc vào kiểm soát Đông Dương.","Liên Xô có phạm vi ảnh hưởng và kiểm soát ở các nước Đông Dương."],"answer":0},{"n":25,"stem":"Nội dung nào sau đây không phải là xu thế phát triển của thế giới sau Chiến tranh lạnh?","passage":[],"options":["Chủ nghĩa phát xít xuất hiện khắp nơi và đang đe dọa các nước ở châu Âu.","Trật tự thế giới mới đang trong quá trình hình thành theo xu hướng đa cực.","Hòa bình thế giới được củng cố nhưng ở nhiều khu vực lại không ổn định.","Các quốc gia có sự điều chỉnh chiến lược, tập trung vào phát triển kinh tế."],"answer":0},{"n":26,"stem":"Một trong những nguyên nhân dẫn đến sự sụp đổ của Trật tự thế giới hai cực I-an-ta là do","passage":[],"options":["sự nổi lên và phát triển mạnh mẽ của Tây Âu.","Nhật Bản vươn lên thành một cực đối đầu với Mỹ.","Mỹ không còn là cường quốc số một thế giới.","việc ra đời của các tổ chức quốc sự đối đầu nhau."],"answer":0},{"n":27,"stem":"Một trong những nguyên nhân dẫn đến sự sụp đổ của Trật tự thế giới hai cực I-an-ta là do","passage":[],"options":["Nhật Bản vươn lên thành một cực đối đầu với Mỹ.","sự thay đổi mạnh mẽ trong cán cân kinh tế thế giới.","sự ảnh hưởng của cuộc Cách mạng công nghệ 4.0.","sự ra đời của chủ nghĩa phát xít trên toàn thế giới."],"answer":1},{"n":28,"stem":"Một trong những tác động của sự sụp đổ Trật tự thế giới hai cực I-an-ta là","passage":[],"options":["xu thế toàn cầu hóa ra đời và chi phối cục diện thế giới.","Mỹ đã không còn là cường quốc đứng đầu trên thế giới.","mở ra một thời kì phát triển mới trong quan hệ quốc tế.","phạm vi ảnh hưởng của Liên Xô bị thu hẹp ở nhiều nơi."],"answer":2},{"n":29,"stem":"Một trong những tác động của sự sụp đổ Trật tự thế giới hai cực I-an-ta là","passage":[],"options":["Mỹ đã không còn là cường quốc đứng đầu trên thế giới.","phạm vi ảnh hưởng của Liên Xô bị thu hẹp ở nhiều nơi.","xu thế toàn cầu hóa ra đời, chi phối trật tự thế giới mới.","đã thúc đẩy những xu hướng phát triển mới của thế giới."],"answer":3},{"n":30,"stem":"Một trong những tác động của sự sụp đổ Trật tự thế giới hai cực I-an-ta là","passage":[],"options":["làm thay đổi so sánh lực lượng với ưu thế tạm thời thuộc về Mỹ.","Mỹ đã không còn là cường quốc đứng đầu, số một trên thế giới.","xu thế toàn cầu hóa ra đời và chi phối mạnh mẽ cục diện thế giới.","thu hẹp phạm vi ảnh hưởng của Mĩ và Liên Xô ở nhiều khu vực."],"answer":0},{"n":31,"stem":"Mỹ và Liên Xô tuyên bố kết thúc Chiến tranh lạnh là do","passage":[{"t":"p","text":"“Sau khi Chiến tranh lạnh kết thúc, so sánh lực lượng trên bình diện toàn cầu từ chỗ cân bằng giữa hai hệ thống chính trị - xã hội đối lập nay chuyển sang trạng thái mất cân bằng theo hướng có lợi cho Mĩ và phương Tây. Tuy nhiên, tình hình quốc tế đã không phát triển một cách hòa bình, ổn định như người ta mong đợi. Sự đối đầu Đông - Tây về hệ tư tưởng, chính trị, quân sự, kinh tế [...] đã từng chi phối đời sống quốc tế trong suốt thời kỳ Chiến tranh lạnh, nay được chuyển hoá dưới những hình thức khác, bên cạnh sự nổi lên của những mâu thuẫn mới. Sự vận động của các mâu thuẫn này sẽ quyết định diện mạo của trật tự thế giới và xu hướng phát triển của quan hệ quốc tế sau Chiến tranh lạnh”."},{"t":"p","text":"(Trần Thị Vinh (Chủ biên), Lịch sử thế giới hiện đại, Quyển 2, NXB Đại học sư phạm, Hà Nội, 2008, tr. 102-103)"}],"options":["áp lực từ các nước Đồng minh và tác động của phong trào giải phóng dân tộc.","sự can thiệp của Liên hợp quốc vào quan hệ song phương hai nước.","sự suy giảm thế mạnh của Mỹ và Liên Xô do chạy đua vũ trang kéo dài.","sự ra đời và ngày càng lớn mạnh của hệ thống xã hội chủ nghĩa."],"answer":2},{"n":32,"stem":"Chiến tranh lạnh chấm dứt cùng sự sụp đổ của Liên Xô và Đông Âu (1991) đã tác động như thế nào đến cục diện thế giới?","passage":[{"t":"p","text":"“Sau khi Chiến tranh lạnh kết thúc, so sánh lực lượng trên bình diện toàn cầu từ chỗ cân bằng giữa hai hệ thống chính trị - xã hội đối lập nay chuyển sang trạng thái mất cân bằng theo hướng có lợi cho Mĩ và phương Tây. Tuy nhiên, tình hình quốc tế đã không phát triển một cách hòa bình, ổn định như người ta mong đợi. Sự đối đầu Đông - Tây về hệ tư tưởng, chính trị, quân sự, kinh tế [...] đã từng chi phối đời sống quốc tế trong suốt thời kỳ Chiến tranh lạnh, nay được chuyển hoá dưới những hình thức khác, bên cạnh sự nổi lên của những mâu thuẫn mới. Sự vận động của các mâu thuẫn này sẽ quyết định diện mạo của trật tự thế giới và xu hướng phát triển của quan hệ quốc tế sau Chiến tranh lạnh”."},{"t":"p","text":"(Trần Thị Vinh (Chủ biên), Lịch sử thế giới hiện đại, Quyển 2, NXB Đại học sư phạm, Hà Nội, 2008, tr. 102-103)"}],"options":["Thúc đẩy phong trào cách mạng vô sản chống chủ nghĩa phát xít diễn ra mạnh mẽ.","Chứng tỏ chủ nghĩa xã hội mở rộng ảnh hưởng và trở thành hệ thống trên toàn thế giới.","Làm sụp đổ trật tự thế giới hai cực, mở đường cho trật tự đa cực hình thành.","Tạo điều kiện cho cách mạng công nghệ và xu thế toàn cầu hóa hình thành."],"answer":2},{"n":33,"stem":"Sau Chiến tranh lạnh, so sánh các mặt trên bình diện toàn cầu đã cho thấy","passage":[{"t":"p","text":"“Sau khi Chiến tranh lạnh kết thúc, so sánh lực lượng trên bình diện toàn cầu từ chỗ cân bằng giữa hai hệ thống chính trị - xã hội đối lập nay chuyển sang trạng thái mất cân bằng theo hướng có lợi cho Mĩ và phương Tây. Tuy nhiên, tình hình quốc tế đã không phát triển một cách hòa bình, ổn định như người ta mong đợi. Sự đối đầu Đông - Tây về hệ tư tưởng, chính trị, quân sự, kinh tế [...] đã từng chi phối đời sống quốc tế trong suốt thời kỳ Chiến tranh lạnh, nay được chuyển hoá dưới những hình thức khác, bên cạnh sự nổi lên của những mâu thuẫn mới. Sự vận động của các mâu thuẫn này sẽ quyết định diện mạo của trật tự thế giới và xu hướng phát triển của quan hệ quốc tế sau Chiến tranh lạnh”."},{"t":"p","text":"(Trần Thị Vinh (Chủ biên), Lịch sử thế giới hiện đại, Quyển 2, NXB Đại học sư phạm, Hà Nội, 2008, tr. 102-103)"}],"options":["sự mất cân bằng theo hướng có lợi cho Mỹ và phương Tây.","tất cả mâu thuẫn đều được giải quyết bằng biện pháp hòa bình.","Mỹ - Liên Xô đã chuyển từ quan hệ đồng minh sang đối đầu.","có sự cân bằng giữa hai hệ thống chính trị - xã hội đối lập."],"answer":0}],"tf":[{"n":1,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Sự chấm dứt Chiến tranh lạnh và sự sụp đổ của hệ thống xã hội chủ nghĩa (XHCN) thế giới đã kết thúc thời kì thế giới hai cực, chấm dứt sự đối đầu của hai hệ thống chính trị, kinh tế, xã hội, mở ra một thời kì hội nhập kinh tế toàn cầu thực sự với sự chuyển đổi của hầu hết các quốc gia từng là XHCN, các quốc gia đang phát triển sang kinh tế thị trường, mở cửa hội nhập kinh tế quốc tế, xu thế hòa bình, hợp tác phát triển đã trở thành xu thế chính của thời đại. Đây là đặc trưng cực kỳ quan trọng”."},{"t":"p","text":"(Đinh Công Tuấn, Những thay đổi của thế giới sau Chiến tranh lạnh (1991) và tác động của nó đến việc giảng dạy bộ môn Lịch sử bậc đại học hiện nay, Tạp chí Nghiên cứu Lịch sử (12), 2007, tr. 61.)"}],"items":[{"text":"Hòa bình, ổn định, hợp tác phát triển, mở cửa hội nhập kinh tế quốc tế là ngọn cờ chủ yếu để các nước lớn tập hợp lực lượng sau khi Chiến tranh lạnh kết thúc.","answer":false},{"text":"Đặc trưng quan trọng nhất của trật tự thế giới sau Chiến tranh lạnh phù hợp với nguyện vọng kiến tạo một môi trường hòa bình của nhân loại tiến bộ trên thế giới.","answer":true},{"text":"Để chấm dứt sự cạnh tranh trên thế giới, các quốc gia chú trọng hợp tác, phát triển, mở cửa hội nhập kinh tế quốc tế sau khi Chiến tranh lạnh kết thúc hoàn toàn.","answer":false},{"text":"Xu thế chính của thời đại sau khi Chiến tranh lạnh chấm dứt được đoạn tư liệu đề cập là hòa bình, ổn định, hợp tác phát triển, mở cửa hội nhập kinh tế quốc tế.","answer":true}]},{"n":2,"stem":"Cho những thông tin trong bảng sau đây:","passage":[{"t":"table","rows":[["Nước","Nội dung thỏa thuận","Nội dung thỏa thuận"],["Nước","Tại châu Âu","Tại châu Á"],["Liên Xô","Quân đội Liên Xô đóng quân miền Đông nước Đức, Đông Béc-lin và các nước Đông Âu","Trả lại cho Liên Xô nam bán đảo Xa-kha-lin, Liên Xô chiếm bốn đảo thuộc quần đảo Cu-rin"],["","Vùng Đông Âu thuộc phạm vi ảnh hưởng của Liên Xô","Tại Trung Quốc: Liên Xô được thuê cảng Lữ Thuận làm căn cứ hải quân, được trả lại tuyến đường sắt Xi-bi-ri-a… Kiểm soát phía Bắc vĩ tuyến 38 Triều Tiên"],["Mỹ và các nước phương Tây","Quân đội Mỹ, Anh chiếm đóng miền Tây nước Đức, Tây Béc-lin và các nước Tây Âu","Mỹ chiếm đóng Nhật Bản Mỹ kiểm soát Nam vĩ tuyến 38 Triều Tiên - Đông Nam Á, Tây Á, Nam Á thuộc phạm vi ảnh hưởng truyền thống của phương Tây"]]}],"items":[{"text":"Những quyết định của Hội nghị I-an-ta (2/1945) đã tạo cớ cho thực dân Pháp quay trở lại xâm lược Việt Nam.","answer":true},{"text":"Những thỏa thuận tại Hội nghị I-an-ta (2/1945) đã giải quyết triệt để những mâu thuẫn giữa các cường quốc Đồng minh.","answer":false},{"text":"Những thông tin trên là nội dung thỏa thuận của các cường quốc phe Đồng minh tại Hội nghị Ianta (2/1945).","answer":true},{"text":"Những quyết định tại Hội nghị I-an-ta (2/1945) đã dẫn tới hình thành hai cực đối lập: cực Liên Xô và cực các nước Đông Âu.","answer":false}]},{"n":3,"stem":"Cho bảng thông tin sau đây:","passage":[{"t":"table","rows":[["Thời gian","Nội dung"],["1945","Hội nghị I-an-ta (Liên Xô) và Hội nghị Pốt-xđam (Đức) được tổ chức."],["1947","Mỹ phát động Chiến tranh lạnh chống Liên Xô."],["1949","Tổ chức Hiệp ước Bắc Đại Tây Dương (NATO) được thành lập."],["1955","Tổ chức Hiệp ước Vác-sa-va được thành lập."],["1989","Liên Xô và Mỹ tuyên bố chấm dứt Chiến tranh lạnh."],["1991","Hệ thống xã hội chủ nghĩa sụp đổ."]]}],"items":[{"text":"Những quyết định của Hội nghị I-an-ta (1945) đã đem lại thời cơ thuận lợi cho nhiều nước ở châu Âu, châu Á đứng lên giành chính quyền, đánh đuổi phát xít để giành độc lập.","answer":true},{"text":"Sau Chiến tranh thế giới thứ hai, Mỹ và Liên Xô có mưu đồ chia cắt lâu dài nước Đức, đưa vấn đề nước Đức thành tiêu điểm đối đầu hai phe ở châu Âu.","answer":false},{"text":"Bảng thông tin thể hiện quá trình hình thành và sụp đổ của các trật tự thế giới sau Chiến tranh thế giới thứ hai.","answer":false},{"text":"Tổ chức Hiệp ước Vác-sa-va là một liên minh chính trị - quân sự mang tính chất phòng thủ của các nước xã hội chủ nghĩa ở châu Âu.","answer":true}]},{"n":4,"stem":"Cho đoạn tư liệu sau đây:","passage":[{"t":"p","text":"“Sau năm 1945, sự tiến triển của quan hệ quốc tế đã diễn ra trong giới hạn hai trật tự thế giới - trước hết là trật tự lưỡng cực (1945 - 1991), sau đó là trật tự đơn cực - đa nguyên, được bắt đầu hình thành sau khi Liên Xô tan rã. Trật tự thứ nhất được biết đến qua các sách báo dưới tên gọi Yalta - Potsdam - ứng với tên gọi của hai hội nghị quốc tế then chốt (diễn ra ở Yalta từ ngày 4 - 11 tháng Hai và ở Potsdam từ ngày 17 tháng Bảy đến ngày 2 tháng Tám 1945). Nguyên thủ đứng đầu ba nước trong liên minh chống phát xít (Liên Xô, Mỹ và Anh) tham gia những hội nghị này đã đi đến thống nhất những quan điểm nền tảng đối với việc lập trật tự thế giới sau chiến tranh”."},{"t":"p","text":"(Aleksey, Bogaturov, Viktor Averkov, Lịch sử quan hệ quốc tế, NXB Chính trị quốc gia, Hà Nội, 2015, Tr.35-36)."}],"items":[{"text":"Đoạn tư liệu đề cập đến biểu hiện xói mòn, sụp đổ của Trật tự hai cực Ian-ta và xu thế lấy phát triển làm trung tâm xuất hiện.","answer":false},{"text":"Trật tự hai cực Ian-ta hình thành và phát triển dựa trên cơ sở của các hiệp định mang tính pháp lý bền vững.","answer":false},{"text":"Trật tự lưỡng cực sau năm 1945 phản ánh thế giới có sự thỏa hiệp quyền lực và sự chi phối đối đầu giữa các cường quốc đặt ra yêu cầu các quốc gia phải linh hoạt định vị chiến lược đối ngoại.","answer":true},{"text":"Sau Chiến tranh lạnh, sự chuyển dịch từ lưỡng cực sang đơn cực – đa nguyên cho thấy cấu trúc quyền lực luôn biến thiên, đòi hỏi các quốc gia tái cấu trúc phương thức hành động.","answer":true}]},{"n":5,"stem":"Cho đoạn tư liệu sau đây","passage":[{"t":"p","text":"“Ở trật tự mới này, Liên Xô không những bảo vệ vững chắc sự tồn tại, phát triển của nhà nước xã hội chủ nghĩa Xô viết mà còn thu hồi lại được những đất đai của đế chế Nga trước đây bị chiếm đoạt trong cuộc chiến tranh Nga – Nhật (1904 – 1905), mở rộng phạm vi ảnh hưởng ở châu Âu, châu Á, qua đó thiết lập một vành đai an toàn bao quanh phía Tây, phía Đông và phía Nam đất nước. Về phía Mỹ, ở trật tự mới này, Mỹ đã lấn át, khuynh đảo được các cường quốc Tây Âu, Nhật Bản, chi phối được cục diện quốc tế mới, thực hiện từng bước tham vọng “bá chủ toàn cầu” của mình”."},{"t":"p","text":"(Đào Minh Hồng – Lê Hồng Hiệp (Chủ biên), Sổ tay thuật ngữ Quan hệ quốc tế, Khoa Quan hệ quốc tế, Đại học Khoa học xã hội và nhân văn Thành phố Hồ Chí Minh, 2013)"}],"items":[{"text":"Trật tự thế giới mới là kết quả của sự phân chia thành quả thắng lợi giữa hai cường quốc trong khối Đồng minh chống phát xít.","answer":true},{"text":"Trật tự hai cực Ianta được hình thành sau Chiến tranh thế giới thứ hai khẳng định vị thế chi phối thế giới của hai siêu cường Mỹ và Liên Xô.","answer":true},{"text":"Trong hội nghị Ianta, Liên Xô giành được nhiều quyền lợi, thông qua đó, mở rộng được hệ thống thuộc địa của mình ở châu Âu và châu Á.","answer":false},{"text":"Những quyết định của hội nghị Ianta đã đánh dấu thắng lợi mang tính bước ngoặt của Mỹ trong quá trình thực hiện tham vọng “bá chủ toàn cầu”.","answer":true}]}]}];
const $=s=>document.querySelector(s),app=$('#app'),KEY='lichsu-save-v1';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=x=>String(Math.round(x*100)/100).replace('.',','),TFP=[0,.1,.25,.5,1];
const st={get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v));return true}catch(e){return false}},del(){try{localStorage.removeItem(KEY)}catch(e){}}};
const all=[];DATA.forEach(l=>{l.mcq.forEach(q=>all.push({...q,id:l.id+'m'+q.n,type:'mcq',lesson:l.id,lt:l.title}));l.tf.forEach(q=>all.push({...q,id:l.id+'t'+q.n,type:'tf',lesson:l.id,lt:l.title}))});
const byId=Object.fromEntries(all.map(q=>[q.id,q]));let S=null,tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
const score=(s=S)=>s.queue.reduce((x,id)=>x+((s.ans[id]||{}).pts||0),0);
const pass=q=>q.passage.map(b=>b.t=='table'?`<div class="tw"><table>${b.rows.map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>`:`<blockquote>${esc(b.text)}</blockquote>`).join('');
const save=()=>toast(st.set({S,at:Date.now()})?'Đã lưu tiến độ ✓':'Không lưu được: trình duyệt đang chặn bộ nhớ');

function home(){
  S=null;const sv=st.get();
  app.innerHTML=`<h1>Ôn tập Lịch sử</h1><p class="mut">Trắc nghiệm &amp; Đúng – Sai · ${all.length} câu hỏi</p>`+
  (sv&&sv.S?`<div class="card"><b>Tiến độ đã lưu</b><p class="mut">${sv.S.mode=='mcq'?'Trắc nghiệm':'Đúng – Sai'}${sv.S.retry?' (làm lại câu sai)':''} · ${sv.S.finished?'đã hoàn thành':`đang ở câu ${sv.S.i+1}/${sv.S.queue.length}`} · ${fmt(score(sv.S))} điểm · lưu lúc ${new Date(sv.at).toLocaleString('vi-VN')}</p><button id="ct" class="pri">Tiếp tục</button> <button id="dl" class="ghost">Xoá bản lưu</button></div>`:'')+
  `<div class="card"><h3>1. Chọn bài</h3>${DATA.slice().sort((a,b)=>a.id-b.id).map(l=>`<label class="chk"><input type="checkbox" name="ls" value="${l.id}" checked> Bài ${l.id} – ${esc(l.title)} <span class="mut">(${l.mcq.length} trắc nghiệm · ${l.tf.length} đúng–sai)</span></label>`).join('')}
  <h3>2. Chế độ chơi</h3><label class="chk"><input type="radio" name="md" value="mcq" checked> Trắc nghiệm – chọn 1 đáp án đúng</label><label class="chk"><input type="radio" name="md" value="tf"> Đúng – Sai – xét 4 ý của mỗi câu</label>
  <h3>3. Thứ tự câu hỏi</h3><label class="chk"><input type="radio" name="od" value="0" checked> Theo thứ tự</label><label class="chk"><input type="radio" name="od" value="1"> Xáo trộn</label>
  <p><button id="go" class="pri">Bắt đầu</button></p></div>`;
  if(sv&&sv.S){$('#ct').onclick=()=>{S=sv.S;S.finished?result():quiz()};$('#dl').onclick=()=>{st.del();home()}}
  $('#go').onclick=()=>{
    const ls=[...document.querySelectorAll('[name=ls]:checked')].map(x=>+x.value),md=document.querySelector('[name=md]:checked').value,sh=document.querySelector('[name=od]:checked').value=='1';
    const qs=all.filter(q=>q.type==md&&ls.includes(q.lesson)).sort((a,b)=>a.lesson-b.lesson||a.n-b.n).map(q=>q.id);
    if(!qs.length)return toast('Hãy chọn ít nhất một bài');
    S={mode:md,shuffle:sh,queue:sh?shuf(qs):qs,i:0,ans:{}};quiz()};
}

function quiz(){
  const n=S.queue.length,q=byId[S.queue[S.i]];
  const a=S.ans[q.id]=S.ans[q.id]||{sel:q.type=='mcq'?null:[null,null,null,null],done:false};
  let h=`<div class="bar"><b>${S.retry?'Làm lại câu sai · ':''}Câu ${S.i+1}/${n}</b><span class="sc">Điểm: ${fmt(score())}</span></div><div class="prog"><i style="width:${S.i/n*100}%"></i></div>`;
  h+=`<div class="card"><div class="mut">Bài ${q.lesson} – ${esc(q.lt)}</div>${pass(q)}<p class="stem">${esc(q.stem)}</p>`;
  if(q.type=='mcq')h+=q.options.map((o,i)=>`<button class="opt${a.done?(i==q.answer?' ok':i==a.sel?' no':''):(i==a.sel?' sel':'')}" data-i="${i}"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('');
  else h+=q.items.map((it,i)=>{const s=a.sel[i];return `<div class="row${a.done?(s===it.answer?' ok':' no'):''}"><div><b>${'abcd'[i]})</b> ${esc(it.text)}</div><div class="yn"><button data-i="${i}" data-v="1" class="${s===true?'sel':''}">Đúng</button><button data-i="${i}" data-v="0" class="${s===false?'sel':''}">Sai</button></div>${a.done?`<div class="ans">Đáp án: <b>${it.answer?'Đúng':'Sai'}</b></div>`:''}</div>`}).join('');
  if(a.done&&q.type=='tf')h+=`<p><b>Được ${a.c}/4 ý → ${fmt(a.pts)} điểm</b></p>`;
  h+=`<div class="foot"><button id="sv" class="ghost">💾 Lưu tiến độ</button>${q.type=='tf'&&!a.done?`<button id="ck" class="pri"${a.sel.includes(null)?' disabled':''}>Kiểm tra</button>`:a.done?`<button id="nx" class="pri">${S.i+1<n?'Câu tiếp →':'Xem kết quả'}</button>`:''}<button id="ex" class="ghost">Thoát</button></div></div><p class="mut">Tiến độ chỉ được giữ khi bạn bấm “Lưu tiến độ”.</p>`;
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(a.done)return;a.sel=+b.dataset.i;a.done=true;a.ok=a.sel==q.answer;a.pts=a.ok?1:0;quiz()});
  app.querySelectorAll('.yn button').forEach(b=>b.onclick=()=>{if(a.done)return;a.sel[+b.dataset.i]=b.dataset.v=='1';quiz()});
  const ck=$('#ck');if(ck)ck.onclick=()=>{a.c=q.items.filter((it,i)=>a.sel[i]===it.answer).length;a.pts=TFP[a.c];a.ok=a.c==4;a.done=true;quiz()};
  const nx=$('#nx');if(nx)nx.onclick=()=>{if(S.i+1<n){S.i++;quiz();window.scrollTo(0,0)}else result()};
  $('#sv').onclick=save;$('#ex').onclick=home;
}

const rev=id=>{const q=byId[id],a=S.ans[id]||{};return `<div class="rv"><b>Bài ${q.lesson} – Câu ${q.n}.</b> ${esc(q.stem)}`+(q.type=='mcq'?`<br><span class="bad">Bạn chọn: ${a.sel==null?'—':esc(q.options[a.sel])}</span><br><span class="good">Đáp án: ${esc(q.options[q.answer])}</span>`:q.items.map((it,i)=>!a.sel||a.sel[i]!==it.answer?`<br>${'abcd'[i]}) ${esc(it.text)} → <b class="good">${it.answer?'Đúng':'Sai'}</b>`:'').join(''))+`</div>`};
function result(){
  S.finished=true;const n=S.queue.length,sc=score(),wr=S.queue.filter(id=>!(S.ans[id]&&S.ans[id].ok));
  app.innerHTML=`<div class="card ctr"><h2>Kết quả${S.retry?' (làm lại câu sai)':''}</h2><div class="big">${fmt(sc)} / ${n}</div><p>Đúng hoàn toàn ${n-wr.length}/${n} câu · ${Math.round(sc/n*100)}%</p>${S.mode=='tf'?'<p class="mut">Điểm đúng–sai tính theo thang: 1 ý = 0,1 · 2 ý = 0,25 · 3 ý = 0,5 · 4 ý = 1 điểm.</p>':''}
  <div class="foot">${wr.length?`<button id="rt" class="pri">Làm lại ${wr.length} câu sai</button>`:'<b class="good">Tuyệt vời, bạn đúng hết!</b>'}<button id="sv" class="ghost">💾 Lưu kết quả</button><button id="hm" class="ghost">Về menu</button></div></div>`+
  (wr.length?`<div class="card"><h3>Các câu chưa đúng</h3>${wr.map(rev).join('')}</div>`:'');
  $('#sv').onclick=save;$('#hm').onclick=home;
  const rt=$('#rt');if(rt)rt.onclick=()=>{S={mode:S.mode,shuffle:S.shuffle,queue:S.shuffle?shuf(wr):wr,i:0,ans:{},retry:(S.retry||0)+1};quiz();window.scrollTo(0,0)};
  window.scrollTo(0,0);
}
home();
</script></body></html>
